spring.application.name=WiseWay
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:sqlite:${WISEWAY_DB_PATH:./data/wiseway.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
wiseway.frontend-origin=${WISEWAY_FRONTEND_ORIGIN:http://localhost:5173}
wiseway.routing.provider=${WISEWAY_ROUTING_PROVIDER:osrm}
wiseway.routing.osrm-base-url=${WISEWAY_OSRM_BASE_URL:https://router.project-osrm.org}
wiseway.routing.timeout-ms=${WISEWAY_ROUTING_TIMEOUT_MS:5000}
wiseway.geocoding.provider=${WISEWAY_GEOCODING_PROVIDER:photon}
wiseway.geocoding.photon-base-url=${WISEWAY_PHOTON_BASE_URL:https://photon.komoot.io}
wiseway.geocoding.timeout-ms=${WISEWAY_GEOCODING_TIMEOUT_MS:5000}
